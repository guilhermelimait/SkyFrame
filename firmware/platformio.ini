; SkyFrame — standalone firmware for the Waveshare ESP32-S3-Touch-LCD-4B
; Runs every screen on the board itself and gets its data over Wi-Fi.
[platformio]
default_envs = desk

[env:desk]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.embed_files =
  data/inter300.ttf
  data/inter400.ttf
  data/inter500.ttf
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -O2
build_unflags = -Os
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  ricmoo/QRCode@^0.0.1
monitor_speed = 115200
upload_speed = 921600

; Update test: the same firmware, but it reports an older version (1.0.9), so the display finds the
; latest GitHub release as "new", offers it in the settings page and installs it for real.
;   pio run -e update-test -t upload
[env:update-test]
extends = env:desk
build_flags =
  ${env:desk.build_flags}
  -DFW_VERSION=\"1.0.9\"
